<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>更新校历小助手</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f5f7;color:#1d1d1f;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{background:#fff;border-radius:16px;padding:28px;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 10px}p{color:#6e6e73;line-height:1.6}.ver{font-weight:700;color:#0066cc}
</style>
</head>
<body>
<div class="box">
<h1>正在更新校历小助手</h1>
<p id="status">正在清理旧缓存，请保持页面打开…</p>
<p class="ver">目标版本 v1.5.20</p>
</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    status.textContent='更新完成，正在打开最新版…';
    location.replace('https://care-for-empty-nest-mother.github.io/campus-calendar-assistant-pwa/?v='+Date.now());
  }catch(e){
    status.textContent='自动更新失败：'+(e.message||e)+'。请手动重新打开校历小助手。';
  }
})();
</script>
</body>
</html>
