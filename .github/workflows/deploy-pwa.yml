name: deploy-pwa
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Extract PWA
        run: |
          mkdir -p dist
          unzip -q pwa-site-v1.5.2.zip -d dist
          cp index-v1.5.18.html dist/index.html
          cp sw.js dist/sw.js
          cp install-ios.html dist/install-ios.html
          cp extract-course-v4.shortcut dist/extract-course-v4.shortcut
          cp extract-course-v4.zip dist/extract-course-v4.zip
          cp extract-course-v5-unsigned.zip dist/extract-course-v5-unsigned.zip
          cp extract-course-v5.shortcut dist/extract-course-v5.shortcut
          cp extract-course-v7.shortcut dist/extract-course-v7.shortcut
          cp extract-course-v5.1.shortcut dist/extract-course-v5.1.shortcut
          cp force-update.html dist/force-update.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
