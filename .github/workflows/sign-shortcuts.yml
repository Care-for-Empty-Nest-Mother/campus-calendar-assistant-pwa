name: sign-shortcuts
on:
  workflow_dispatch:
  push:
    paths:
      - 'shortcuts/*.xml'
      - '.github/workflows/sign-shortcuts.yml'
permissions:
  contents: write
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign shortcuts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shortcuts/signed
          shopt -s nullglob
          for input in shortcuts/*.xml; do
            name="$(basename "$input" .xml)"
            out="shortcuts/signed/$name.shortcut"
            curl --fail --show-error --silent \
              -F "file=@$input;filename=$name.shortcut" \
              "https://sign.shortcuty.app/api/v1/sign" \
              -o "$out"
            test "$(xxd -p -l 4 "$out")" = "41454131"
          done
      - name: Commit signed shortcuts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shortcuts/signed
          git diff --cached --quiet && exit 0
          git commit -m "Build signed iOS shortcuts"
          git push
